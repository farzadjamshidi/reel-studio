<svg
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.fill]="filled() ? 'currentColor' : 'none'"
  [attr.stroke]="filled() ? 'none' : 'currentColor'"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @for (d of paths(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
